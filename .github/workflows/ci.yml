name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch supersedes the first — no value in
# finishing a run whose result is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Reads .node-version rather than pinning here, so the runtime
          # version has one source of truth shared with local dev (fnm).
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      # Kept as separate steps rather than one combined command: a failed
      # run should say which check failed without needing to open the log.
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
