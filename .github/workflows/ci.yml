name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch supersedes the first — no value in
# finishing a run whose result is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      # Ephemeral, job-local container (not reachable outside the runner's
      # network) — same fixed dev credentials as docker-compose.yml are fine
      # here for that reason, unlike the loopback-binding concern that
      # comment documents for the persistent local dev instance.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: scraplify
          POSTGRES_PASSWORD: scraplify_dev
          POSTGRES_DB: scraplify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scraplify -d scraplify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://scraplify:scraplify_dev@localhost:5432/scraplify
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Reads .node-version rather than pinning here, so the runtime
          # version has one source of truth shared with local dev (fnm).
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      # Kept as separate steps rather than one combined command: a failed
      # run should say which check failed without needing to open the log.
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate
        run: npm run db:migrate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
