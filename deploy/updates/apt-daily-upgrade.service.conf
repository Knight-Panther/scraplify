# Installed as /etc/systemd/system/apt-daily-upgrade.service.d/xtelo.conf by
# deploy/updates/install.sh: the updates run only in a quiet hour
# (xtelo-update-guard.sh says what that is). A "not now" skips the try without
# failing the unit.
[Service]
ExecCondition=/usr/local/sbin/xtelo-update-guard
