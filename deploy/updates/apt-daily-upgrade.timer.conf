# Installed as /etc/systemd/system/apt-daily-upgrade.timer.d/xtelo.conf by
# deploy/updates/install.sh. Ubuntu tries once a day between 06:00 and 07:00,
# inside the ss.ge run. Try every hour instead: xtelo-update-guard decides
# whether the hour is quiet, and apt installs at most once a calendar day.
[Timer]
OnCalendar=
OnCalendar=*-*-* *:20:00
RandomizedDelaySec=0
