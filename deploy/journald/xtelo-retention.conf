# System journal retention on the host (owner decision, 2026-09-27: nothing
# operational is kept past 60 days). Every Xtelo unit logs to the journal,
# so this is the web, pipeline and backup logs' retention.
#
#   sudo install -D -m 0644 deploy/journald/xtelo-retention.conf \
#     /etc/systemd/journald.conf.d/xtelo-retention.conf
#   sudo systemctl restart systemd-journald

[Journal]
# Persist across reboots (Ubuntu's default already, stated so it stays true).
Storage=persistent
MaxRetentionSec=60day
# A size cap as well, so a noisy week cannot fill a 40 GB disk first.
SystemMaxUse=1G
